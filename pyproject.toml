[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trendlab-cli"
version = "0.3.0"
description = "TrendLab CLI — a local-first, model-agnostic agentic coding harness with remote approvals."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tony Williams", email = "antoniowilliams123@gmail.com" }]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.6",
  "httpx>=0.27",
  "tomli-w>=1.0",
  "anthropic>=1.0",
  "textual>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
trendlab = "trendlab.cli:main"

[tool.setuptools.packages.find]
include = ["trendlab*"]

[tool.setuptools.package-data]
"trendlab.approvals.channels" = ["*.html"]
"trendlab.prompts" = ["drivers/*.md", "drivers/models/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"trendlab/cli.py" = ["B008"]  # typer.Option defaults are the framework idiom
"tests/*" = ["E501"]
"trendlab/benchmarks/fixtures.py" = ["E501"]  # fixture sources are data
"trendlab/benchmarks/suite.py" = ["E501"]  # base repos and defects are data
"trendlab/security/injection.py" = ["E501"]  # detection patterns read better unwrapped
"trendlab/telemetry/dashboard.py" = ["E501"]  # CSS and HTML template text
"trendlab/context/retrieval.py" = ["E501"]  # word and extension lists
"trendlab/benchmarks/redteam.py" = ["E501"]  # attack prompt text
"trendlab/orchestration/subagents.py" = ["E501"]  # role prompts read better unwrapped
"trendlab/ui/activity.py" = ["E501"]  # one markup line per event reads better unwrapped
