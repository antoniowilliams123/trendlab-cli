# ~/.trendlab/config.toml — TrendLab CLI example configuration.
# Secrets are NEVER stored here; they are referenced by environment-variable name.

[defaults]
model = "openai:gpt-4o-mini"
permission_mode = "auto"         # auto (default, no prompts) | ask | auto_edit | trusted | plan
allow_destructive = false        # auto mode: also skip the prompt for rm -rf / history-rewriting git git

[limits]
max_iterations = 50
# max_cost_usd = 5.00
# max_model_calls = 200
# max_wall_clock_minutes = 90
warn_at_fraction = 0.8
parallel_tools = 6               # consecutive read-only tool calls run concurrently (spec §90.3)

# ---------------------------------------------------------------------------
# OS sandbox for shell commands (bubblewrap, Linux/WSL2) — spec §90.1
# ---------------------------------------------------------------------------
[sandbox]
# mode = "docker" runs shell commands in docker_image with the project at /work (spec §8.3).
# docker_image = "python:3.12-slim"
mode = "auto"                    # auto (on when bwrap is installed) | on | off
allow_network = false            # network/package commands (curl, git push, pip, gh ...) get it anyway
writable_paths = ["~/.cache"]    # besides the project root

# Linters / type-checkers run after every edit and fed back to the model — spec §90.2
[diagnostics]
enabled = true
timeout_seconds = 60
# [diagnostics.commands]
# ".py" = ["ruff check --output-format concise {files}", "pyright {files}"]

# Project memory across sessions (spec §92.1): .trendlab/memory.md, learned after noteworthy runs
[memory]
enabled = true
learn = true                     # extract facts with the summarizer role after runs that edit/validate
max_entries = 60

# Hold the first change of every run until you approve the plan (terminal, phone, Telegram)
[plan_gate]
enabled = false                  # or: trendlab --plan-gate · /plan gate on
timeout_minutes = 30

[context]
# Tiered tool output (spec §2): tokens the lead sees per tool; the full text goes to
# .trendlab/traces/<call_id>.log for inspect_output. read_file is never tiered.
# tool_budgets = { shell = 1500, run_tests = 1200, search_text = 1000, list_directory = 600, web_fetch = 1500 }
# screener_threshold_tokens = 3000
auto_compact = true
compact_threshold = 0.75         # of the model's context window
default_context_window = 128000
repo_map_max_files = 400
min_compaction_tokens = 1500     # never compact a conversation smaller than this

[git]
respect_gitignore = true

[retry]
max_attempts = 3
base_delay_seconds = 1.0

# Anthropic (official SDK). Key from ANTHROPIC_API_KEY, `trendlab secret set ANTHROPIC_API_KEY`,
# or an `ant auth login` profile. Adaptive thinking is on for 4.6+ models; Haiku runs without it.
[providers.anthropic]
type = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
max_tokens = 16000
thinking = "auto"               # auto | adaptive | off
# effort = "xhigh"              # low | medium | high | xhigh | max (coding/agentic work likes xhigh)
refusal_fallbacks = "auto"      # auto | on | off — server-side fallback on Fable 5.x / Opus 5 declines
prompt_caching = true           # cache_control breakpoints on the system prompt + latest turn

[providers.openai]
type = "openai_compatible"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[providers.deepseek]
type = "openai_compatible"
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"

[providers.moonshot]
type = "openai_compatible"
base_url = "https://api.moonshot.ai/v1"
api_key_env = "MOONSHOT_API_KEY"

[providers.ollama]
type = "ollama"                  # native /api/chat with the model's real context window (spec §90.16)
base_url = "http://localhost:11434"
# tool_calling = "structured"   # force the JSON fallback for models with weak native tool calls

# Model registry (spec §58) — capabilities you know; discovered where APIs expose them.
[models."deepseek:deepseek-chat"]
context_window = 64000
supports_tools = true

[models."anthropic:claude-opus-5"]
context_window = 1000000

[models."ollama:qwen2.5-coder:14b"]
context_window = 32768
local = true

[models."ollama:qwen3-coder"]
context_window = 32000
local = true

# Pricing per million tokens (spec §40). Keep this current; code never hard-codes prices.
[pricing."anthropic:claude-opus-5"]
input_per_million = 5.00
output_per_million = 25.00
cached_input_per_million = 0.50

[pricing."anthropic:claude-sonnet-5"]
input_per_million = 2.00
output_per_million = 10.00

[pricing."anthropic:claude-haiku-4-5"]
input_per_million = 1.00
output_per_million = 5.00

[pricing."openai:gpt-4o-mini"]
input_per_million = 0.15
output_per_million = 0.60
cached_input_per_million = 0.075
[pricing."openai:gpt-5"]
input_per_million = 1.25
output_per_million = 10.00
cached_input_per_million = 0.125

[pricing."openai:gpt-5-mini"]
input_per_million = 0.25
output_per_million = 2.00
cached_input_per_million = 0.025

[pricing."openai:gpt-5-nano"]
input_per_million = 0.05
output_per_million = 0.40
cached_input_per_million = 0.005

# Role routing (spec §11). Missing roles use the session model. "escalation" takes over the rest of a
# run after two no-progress strikes or two rejected completions, then the default model returns.
[routing]
# The cheap-model cocktail (cheap-model spec §6.1): a cheap lead, a stronger model for the
# few short calls that decide quality. `trendlab init` writes this for DeepSeek.
# planning   = "deepseek:deepseek-v4-pro"   # step plan for non-trivial tasks (1–3 calls)
# verifier   = "deepseek:deepseek-v4-pro"   # reviews the diff before a run is reported done
# escalation = "deepseek:deepseek-v4-pro"   # takes over after two rejected completions or a loop
# screener   = "deepseek:deepseek-flash"    # tiers oversized tool output
# summarizer = "deepseek:deepseek-flash"
# explorer = "anthropic:claude-sonnet-5"
# reviewer = "anthropic:claude-opus-5"

# Verify-then-surface (spec §3.2, §5).
[verification]
verifier = "required"      # required | advisory | off (needs routing.verifier or escalation)
max_rounds = 1             # 'fix' verdicts handed back to the author
workspace = "inplace"      # inplace | worktree (edit in .trendlab/worktrees, apply verified diff)
regression_gate = true     # fix-type tasks must add/change a test or state a waiver
min_diff_lines = 30        # review runs when the diff is at least this big ...
min_files = 2              # ... or touches this many files, or validation did not pass

# Planner and best-of-N (spec §3.3, §4).
[planner]
enabled = true
max_calls = 3
min_prompt_chars = 400     # plan long briefs only (M1: planning medium prompts cost more than it saved)

[attempts]
best_of = "auto"           # 3 for models under $1/M input (or local), else 1
cheap_price_per_m = 1.0

# Per-model prompt layer (spec §6.3): packaged driver notes + ~/.trendlab/skills/_model/ + project.
[prompts]
drivers = true

# Engine daemon (spec §7): `trendlab engine start`.
[engine]
projects = []              # roots to watch and sleep over
watch_minutes = 60
sleep_at = "02:30"
meta_days = 1
digest_minutes = 180
file_failed_runs = true

# Provider fallback for infrastructure failures only (spec §69).
[fallback]
# "openai:gpt-4o-mini" = ["deepseek:deepseek-chat"]

# Project validation commands (auto-detected when omitted).
[project]
# test_command = "python -m pytest -q"
# lint_command = "ruff check ."

# Lifecycle hooks (spec §39): session_start, before_model_call, after_model_call, before_tool,
# after_tool, before_write, after_write, task_complete, session_end.
# [[hooks]]
# event = "after_write"
# command = "ruff format $TRENDLAB_FILES"
# timeout_seconds = 30
# [[hooks]]
# event = "before_write"
# command = "./scripts/policy-check.sh"
# blocking = true

# MCP servers (spec §37): tools pass through TrendLab permissions with the given category.
# [mcp.servers.github]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-github"]
# category = "network"          # read_only | network | shell_write | ...

# ---------------------------------------------------------------------------
# Remote approval (phone). Disabled until you enable it:
#   trendlab remote enable --host <tailscale-ip> --allow-insecure-http
# ---------------------------------------------------------------------------
[remote_approval]
enabled = false
channel = "web"
host = "127.0.0.1"               # your Tailscale IP / LAN IP to reach it from a phone
port = 8787
# public_url = "https://thinkpad.tailnet.ts.net:8787"
request_timeout_minutes = 30
allow_high_risk = false          # irreversible ops stay terminal-only unless true
allow_session_scope = true
# tls_cert = "/home/me/.trendlab/cert.pem"
# tls_key  = "/home/me/.trendlab/key.pem"
allow_insecure_http = false      # must be true to bind a non-loopback address without TLS
machine_name = "ThinkPad"
telegram = false                 # also send approvals as Telegram messages with inline buttons
                                 # (uses [notifications.telegram] below; decisions via getUpdates)

# Remote control from a Telegram chat (spec §90.12). Uses [notifications.telegram] below.
[telegram_bridge]
enabled = false                  # or: trendlab --telegram · /telegram on
allow_commands = true            # read-only slash commands from the chat; permission/approval ones never

[notifications]
enabled = false
provider = "none"                # none | telegram | ntfy | webhook
notify_on = ["approval", "question", "completion", "failure"]
reminder_at_fraction = 0.75      # re-notify when a pending approval reaches 75% of its timeout

[notifications.telegram]
bot_token_env = "TRENDLAB_TELEGRAM_BOT_TOKEN"
chat_id = ""

[notifications.ntfy]
server = "https://ntfy.sh"
topic = ""                       # pick something unguessable, e.g. "trendlab-7f3a9c"

[notifications.webhook]
url = ""
